name: CI

# Spec 9.6: on every pull request -- linting, unit tests, integration tests, the
# tenant-isolation suite, a migration up-and-down check, and a dependency scan.
# All must pass before merge is possible.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: black
        run: black --check --line-length 100 app tests wsgi.py
      - name: flake8
        run: flake8 app tests wsgi.py --max-line-length=100 --extend-ignore=E203,W503

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolos_test
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      FLASK_ENV: testing
      FLASK_APP: wsgi.py
      SECRET_KEY: ci-secret-key-not-used-in-any-real-environment
      JWT_SECRET_KEY: ci-jwt-secret-key-not-used-in-any-real-environment
      TEST_DATABASE_URL: postgresql+psycopg://schoolos:schoolos@localhost:5432/schoolos_test
      DATABASE_URL: postgresql+psycopg://schoolos:schoolos@localhost:5432/schoolos_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Tenant isolation suite
        # Called out separately: if this fails, nothing ships (spec 8.2).
        run: pytest tests/test_tenant_isolation.py -v

      - name: Results engine suite
        run: pytest tests/test_results_engine.py -v

      - name: Full suite with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolos_migrations
          POSTGRES_USER: schoolos
          POSTGRES_PASSWORD: schoolos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      FLASK_ENV: development
      FLASK_APP: wsgi.py
      SECRET_KEY: ci-secret-key-not-used-in-any-real-environment
      JWT_SECRET_KEY: ci-jwt-secret-key-not-used-in-any-real-environment
      DATABASE_URL: postgresql+psycopg://schoolos:schoolos@localhost:5432/schoolos_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Every migration runs up, down and up again
        run: |
          flask db upgrade
          flask db downgrade base
          flask db upgrade

      - name: Models and migrations have not drifted
        # Autogenerate against the migrated database: if it wants to change
        # anything, a model was edited without a migration.
        run: |
          flask db migrate -m "ci drift check"
          generated=$(git ls-files --others --exclude-standard migrations/versions)
          if [ -z "$generated" ]; then
            echo "No drift."
            exit 0
          fi
          if grep -qE '^\s+op\.(create|drop|add|alter|rename)' $generated; then
            echo "::error::Models have changed without a migration. Run 'flask db migrate'."
            cat $generated
            exit 1
          fi
          echo "No drift."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --strict
