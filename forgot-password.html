<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · School Management System</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap.sa{ background:linear-gradient(135deg,#0d1224 0%,#161b2e 100%); }
</style>
</head>
<body>
<div class="login-wrap sa">
  <div class="login-card">
    <h1>Reset Password</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <div class="error-msg" id="error-msg" style="display:none;">Please enter a valid email address.</div>
    <div id="success-msg" style="display:none;color:#2e7d32;background:#eafaf0;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13.5px;">
      If an account exists for that email, a reset link has been sent.
    </div>

    <form id="reset-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn block">Send Reset Link</button>
    </form>

    <p class="login-foot" style="margin-top:14px;"><a href="#" id="back-link">← Back to sign in</a></p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get("role") || "admin";
  const roleLoginPages = {
    superadmin: "superadmin-login.html",
    admin: "admin-login.html",
    teacher: "teacher-login.html",
    student: "student-login.html",
    parent: "parent-login.html"
  };
  const backHref = roleLoginPages[role] || "index.html";
  document.getElementById("back-link").href = backHref;

  document.getElementById("reset-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    if (!email) {
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
      return;
    }
    errorMsg.style.display = "none";
    successMsg.style.display = "block";
  });
</script>
</body>
</html>
