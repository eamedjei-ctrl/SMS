<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Classes &amp; Subjects</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="row-flex"><button class="menu-btn" id="menu-btn">☰</button>
        <div><h1 id="topbar-title"></h1><div class="sub" id="topbar-sub"></div></div>
      </div>
      <button class="btn" onclick="document.getElementById('new-class-form').classList.toggle('open-form')">+ New Class</button>
    </div>
    <div class="content">
      <div class="panel" id="new-class-form" style="display:none;">
        <div class="panel-head"><h2>Create Class</h2></div>
        <div class="toolbar">
          <input placeholder="Class name (e.g. JHS 2B)" style="flex:1;">
          <select id="teacher-select"></select>
          <input placeholder="Subject" style="flex:1;">
          <button class="btn">Save Class</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Classes</h2></div>
        <table>
          <thead><tr><th>Class</th><th>Class Teacher</th><th>Subject</th><th>Students</th></tr></thead>
          <tbody id="classes-body"></tbody>
        </table>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Subjects</h2></div>
        <div class="row-flex" id="subjects-list" style="flex-wrap:wrap;gap:8px;"></div>
        <div class="toolbar" style="margin-top:14px;">
          <input id="new-subject" placeholder="New subject name" style="flex:1;">
          <button class="btn" onclick="addSubjectToCatalogue()">+ Add Subject</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  API_READY.then(async () => {
  renderShell({ role:"admin", active:"admin-classes.html", title:"Classes & Subjects", sub:"Manage class groups and the subject catalogue" });

  document.getElementById("teacher-select").innerHTML = DB.teachers.map(t=>`<option>${t.name}</option>`).join("");

  document.getElementById("classes-body").innerHTML = DB.classes.map(c=>`
    <tr>
      <td><strong>${c.name}</strong></td>
      <td>${c.teacher}</td>
      <td>${c.subject}</td>
      <td>${c.students}</td>
    </tr>`).join("");

  function renderSubjects(){
    document.getElementById("subjects-list").innerHTML = DB.subjects.map(s=>`<span class="badge blue">${s}</span>`).join("");
  }
  renderSubjects();

  async function addSubjectToCatalogue(){
    const input = document.getElementById("new-subject");
    if (input.value.trim()){
      await addSubject(input.value.trim());
      input.value = "";
      renderSubjects();
    }
  }
  window.addSubjectToCatalogue = addSubjectToCatalogue;
</script>
<style>#new-class-form.open-form{display:block !important;}</style>
</body>
</html>
