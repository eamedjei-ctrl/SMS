<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student · School Fees</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="row-flex"><button class="menu-btn" id="menu-btn">☰</button>
        <div><h1 id="topbar-title"></h1><div class="sub" id="topbar-sub"></div></div>
      </div>
    </div>
    <div class="content">
      <div class="panel">
        <div class="panel-head"><h2>Fee Statements</h2></div>
        <div id="fees-list"></div>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  API_READY.then(async () => {
  const me = DB.students[0];
  renderShell({ role:"student", active:"student-fees.html", title:"School Fees", sub:"Fee statements uploaded by the school" });

  const myFees = feesForClass(me.class);
  document.getElementById("fees-list").innerHTML = myFees.length ? myFees.slice().reverse().map(f=>`
    <div class="list-item">
      <div>
        <div class="title">${f.title}</div>
        <div class="meta">${f.class} · ${f.term} · Uploaded ${f.uploadedAt}</div>
      </div>
      <a class="btn small" href="${f.fileData}" download="${f.fileName}">Download</a>
    </div>`).join("") : `<div class="empty">No fee statements have been uploaded yet</div>`;
  }).catch(error => alert(error.message));
</script>
</body>
</html>
