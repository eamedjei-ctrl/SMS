<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin · Schools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="row-flex"><button class="menu-btn" id="menu-btn">☰</button>
        <div><h1 id="topbar-title"></h1><div class="sub" id="topbar-sub"></div></div>
      </div>
      <button class="btn" onclick="document.getElementById('new-school-form').classList.toggle('open-form')">+ New School</button>
    </div>
    <div class="content">
      <div class="panel" id="new-school-form" style="display:none;">
        <div class="panel-head"><h2>Create School</h2></div>
        <div class="toolbar">
          <input placeholder="School name" style="flex:1;">
          <input placeholder="Address" style="flex:1;">
          <button class="btn">Save School</button>
        </div>
      </div>
      <div class="panel">
        <div class="toolbar">
          <input placeholder="Search schools..." style="min-width:220px;">
          <select><option>All Statuses</option><option>Active</option><option>Suspended</option></select>
          <div class="spacer"></div>
        </div>
        <table>
          <thead><tr><th>School</th><th>Address</th><th>Students</th><th>Staff</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  API_READY.then(async () => {
  renderShell({ role:"superadmin", active:"superadmin-schools.html", title:"Schools", sub:"Create, edit, suspend or remove school tenants" });
  document.getElementById("body").innerHTML = DB.schools.map(s=>`
    <tr>
      <td><strong>${s.name}</strong></td>
      <td>${s.address}</td>
      <td>${s.students}</td>
      <td>${s.staff}</td>
      <td><span class="badge ${badgeFor(s.status)}">${s.status}</span></td>
      <td>
        <button class="btn ghost small">Edit</button>
        <button class="btn ${s.status==='Active'?'danger':'ghost'} small">${s.status==='Active'?'Suspend':'Activate'}</button>
      </td>
    </tr>`).join("");

  document.getElementById("menu-btn")?.addEventListener("click", ()=>{});
</script>
<style>#new-school-form.open-form{display:block !important;}</style>
</body>
</html>
