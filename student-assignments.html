<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student · Assignments</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="row-flex"><button class="menu-btn" id="menu-btn">☰</button>
        <div><h1 id="topbar-title"></h1><div class="sub" id="topbar-sub"></div></div>
      </div>
    </div>
    <div class="content">
      <div class="panel">
        <div class="panel-head"><h2>My Assignments</h2></div>
        <div id="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;"></div>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  API_READY.then(async () => {
  renderShell({ role:"student", active:"student-assignments.html", title:"Assignments", sub:"Track your assignment status and due dates" });

  document.getElementById("list").innerHTML = DB.assignments.map(a=>`
    <div class="panel" style="margin:0;">
      <div class="panel-head"><h2 style="font-size:15px;">${a.title}</h2><span class="badge ${badgeFor(a.status)}">${a.status}</span></div>
      <div class="meta">${a.subject}</div>
      <div class="meta">Due ${a.due}</div>
    </div>`).join("");
  }).catch(error => alert(error.message));
</script>
</body>
</html>
